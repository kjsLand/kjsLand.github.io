  <rect x="24" y="232" width="150" height="42" rx="8" fill="none" stroke="#ffedcb" stroke-opacity=".35" stroke-dasharray="4 4"/>
  <path d="M38 242h12l5 5v17H38z" fill="none" stroke="#ffedcb" stroke-opacity=".6"/>
  <text x="66" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" letter-spacing="0" fill="#ffedcb" fill-opacity="0.75" text-anchor="start">notes.zip</text>
