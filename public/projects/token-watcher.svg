<g transform="translate(456 316)">
  <rect width="244" height="34" rx="8" fill="#dea01e"/>
  <text x="14" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" letter-spacing="1.5" fill="#0a0d12" fill-opacity="0.7" text-anchor="start">TOTAL</text>
