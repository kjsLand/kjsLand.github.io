  <rect x="76" y="10" width="260" height="18" rx="9" fill="#121821" stroke="#ffedcb" stroke-opacity=".12"/>
  <line x1="396" y1="38" x2="396" y2="320" stroke="#ffedcb" stroke-opacity=".2"/>

  <rect x="150" y="60" width="220" height="48" rx="12" fill="none" stroke="#ffedcb" stroke-opacity=".35"/>
  <rect x="166" y="74" width="180" height="6" rx="3.0" fill="#ffedcb" fill-opacity="0.5"/><rect x="166" y="90" width="120" height="6" rx="3.0" fill="#ffedcb" fill-opacity="0.5"/>
  <rect x="24" y="126" width="300" height="88" rx="12" fill="url(#hatchSteel)" stroke="#8fa3c0" stroke-opacity=".45"/>
