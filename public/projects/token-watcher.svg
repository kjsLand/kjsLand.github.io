<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Token Watcher: a browser chat beside the extension's side panel, which totals the tokens in prompts, output and files">
<title>Token Watcher: a browser chat beside the extension's side panel, which totals the tokens in prompts, output and files</title>
<defs>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffedcb" fill-opacity=".16"/></pattern>
  <pattern id="hatchGold" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#dea01e" stroke-opacity=".55" stroke-width="2.5"/></pattern>
  <pattern id="hatchSteel" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#8fa3c0" stroke-opacity=".28" stroke-width="1.5"/></pattern>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ffedcb" stroke-opacity=".07"/></pattern>
  <pattern id="dense" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.6" fill="#ffedcb" fill-opacity=".55"/></pattern>
</defs>
<rect width="800" height="400" fill="#121821"/>
<rect width="800" height="400" fill="url(#dots)"/>
<g transform="translate(64 52) scale(0.86)">

