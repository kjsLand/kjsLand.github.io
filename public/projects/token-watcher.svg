pace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" letter-spacing="0" fill="#ffedcb" fill-opacity="0.9" text-anchor="end">1,120</text><rect x="476" y="247" width="200" height="8" fill="url(#hatchSteel)" stroke="#ffedcb" stroke-opacity=".12"/><rect x="476" y="247" width="24" height="8" fill="#dea01e"/>
